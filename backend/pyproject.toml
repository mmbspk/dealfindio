[tool.poetry]
name = "dealfindio-backend"
version = "0.1.0"
description = "Australian grocery deal finder - backend API"
authors = ["dealfindio team <contact@dealfindio.com.au>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {version = "^0.24.0", extras = ["standard"]}
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
psycopg = {version = "^3.1.12", extras = ["binary"]}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
redis = "^5.0.1"
celery = "^5.3.4"
playwright = "^1.40.0"
pdfplumber = "^0.10.3"
pytesseract = "^0.3.10"
rapidfuzz = "^3.5.2"
prophet = "^1.1.5"
statsmodels = "^0.14.0"
scikit-learn = "^1.3.2"
httpx = "^0.25.2"
firebase-admin = "^6.2.0"
anthropic = "^0.40.0"
python-dotenv = "^1.0.0"
sentry-sdk = "^1.38.0"
python-json-logger = "^2.0.7"
pytz = "^2023.3"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
beautifulsoup4 = "^4.15.0"
pdf2image = "^1.17.0"
python-multipart = "^0.0.32"
psycopg2-binary = "^2.9.12"
asyncpg = "^0.31.0"
boto3 = "^1.34.0"
tenacity = "^8.2.3"
pgvector = "^0.5.0"
sentence-transformers = "^6.0.1"
itsdangerous = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
black = "^23.12.0"
ruff = "^0.1.8"
pyright = "^1.1.339"
pre-commit = "^3.5.0"
faker = "^20.1.0"
httpx = "^0.25.2"
fakeredis = "^2.37.1"

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", ".venv", "dist", "build"]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "C",      # flake8-comprehensions
  "B",      # flake8-bugbear
]
ignore = [
  "E501",   # line too long (handled by black)
  "W291",   # trailing whitespace (handled by black)
  "B008",   # Depends() in function defaults is idiomatic FastAPI
  "B904",   # raise-without-from-inside-except (too noisy for existing code)
  "C901",   # function complexity (subjective)
  "E402",   # module-level import not at top (scripts use sys.path manipulation)
  "F821",   # undefined name — SQLAlchemy uses forward-ref strings resolved at runtime
  "E712",   # comparison to True/False (== True vs is True)
  "E711",   # comparison to None (== None vs is None)
  "B017",   # pytest.raises(Exception) — acceptable in existing test suite
  "F841",   # local variable assigned but never used
  "E741",   # ambiguous variable name
  "C416",   # unnecessary dict/list comprehension
  "C405",   # unnecessary list literal for set
]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.pyright]
include = ["app", "tests"]
exclude = ["**/node_modules", "**/__pycache__", ".venv"]
typeCheckingMode = "basic"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportGeneralTypeIssues = "warning"
pythonVersion = "3.12"
# SQLAlchemy uses string forward-references in relationship() that pyright
# cannot resolve statically — suppress rather than litter every model file.
reportUndefinedVariable = "none"
# SQLAlchemy Pool/Result expose runtime attributes not in stubs; Celery signal
# senders are typed as Optional but are always non-None in practice.
reportOptionalMemberAccess = "none"
reportOptionalSubscript = "none"
reportOptionalCall = "none"
reportOptionalOperand = "none"
reportAttributeAccessIssue = "none"
# SQLAlchemy execute() overloads and missing constructor args in generated code.
reportCallIssue = "none"
# Third-party packages without py.typed markers (itsdangerous, etc.).
reportMissingModuleSource = "none"
# Test stubs intentionally pass lightweight fakes to typed parameters.
reportArgumentType = "none"
# Generator fixtures typed with concrete return type instead of Iterator[T].
reportInvalidTypeForm = "none"
reportReturnType = "none"
# Operator overload gaps in SQLAlchemy async Result (Awaitable vs value).
reportOperatorIssue = "none"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --strict-markers -m 'not pg' --cov=app --cov-report=term-missing --cov-fail-under=60"
markers = [
  "asyncio: marks tests as async",
  "integration: marks tests as integration tests",
  "slow: marks tests as slow",
  "pg: marks tests that require a real Postgres+PostGIS DB (TEST_DATABASE_URL)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
