# Alembic configuration at the backend root.
#
# This lets `alembic upgrade head` (and other alembic commands) run from the
# backend/ directory, which is what the deployment startCommand and
# docker-compose use. The actual migration scripts live in db/migrations/.

[alembic]
script_location = db/migrations
prepend_sys_path = .

# The database URL is injected at runtime from application settings
# (DATABASE_URL) in db/migrations/env.py, so this placeholder is unused.
sqlalchemy.url = driver://user:password@localhost/dbname

[loggers]
keys = root,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
