# Alembic Configuration File
# Path: backend/db/migrations/alembic.ini
#
# This is the Alembic configuration template for dealfindio database migrations.
# Alembic is a lightweight database migration tool for SQLAlchemy.
#
# The %%(here)s variable will be replaced with the directory location of this file.

[alembic]
# path to migration scripts
script_location = %(here)s

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time:
# file_template = %%(rev)s_%%(slug)s_%%(create_date)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to datefromtimestamp() of the datetime.datetime
# Leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field that's auto-generated by Alembic.
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# logging configuration
# Loggers to configure [loggers]
[loggers]
keys = root,sqlalchemy.engine

# Handlers to configure [handlers]
[handlers]
keys = console

# Formatters to configure [formatters]
[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

sqlalchemy.url = driver://user:password@localhost/dbname

[migration_context]
# Modifications to the context can be done here.
# The example values shown are the defaults.

# For Alembic 'offline' SQLAlchemy execution context.
# optional string that will precede the DEFAULT ROLE value in the
# CREATE ROLE statement
# role_name =

# Attempt to identify tables not owned by Alembic as introspected (owned_by_alembic_only)
# This defaults to False. Set to True to 2.0 style behavior.
compare_type = false
compare_server_default = false
render_as_batch = false
